<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuxeGlow | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Poppins"', 'sans-serif'],
          },
          colors: {
            brand: {
              light: '#fce7f3',
              main: '#db2777',
              dark: '#831843',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans text-gray-800 bg-gray-50">
  <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        <a href="index.html" class="flex-shrink-0 flex items-center">
          <i class="bi bi-gem text-brand-main text-3xl mr-2"></i>
          <span class="font-serif text-2xl font-bold text-gray-900">LuxeGlow</span>
        </a>
        <div class="hidden md:flex space-x-8 items-center">
          <a href="index.html" class="text-gray-700 hover:text-brand-main font-medium transition">Home</a>
          <a href="products.html" class="text-gray-700 hover:text-brand-main font-medium transition">Shop</a>
          <a href="about.html" class="text-gray-700 hover:text-brand-main font-medium transition">About Us</a>
          <a href="contact.html" class="text-gray-700 hover:text-brand-main font-medium transition">Contact</a>
        </div>
        <div class="hidden md:flex items-center space-x-6">
          <button class="text-gray-600 hover:text-brand-main transition"><i class="bi bi-search text-xl"></i></button>
          <a href="login.html" class="text-brand-main transition"><i class="bi bi-person text-xl"></i></a>
          <button class="text-gray-600 hover:text-brand-main transition relative">
            <i class="bi bi-bag text-xl"></i>
            <span class="absolute -top-2 -right-2 bg-brand-main text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
          </button>
        </div>
        <div class="md:hidden flex items-center">
          <button id="mobile-menu-btn" class="text-gray-600 hover:text-brand-main focus:outline-none">
            <i class="bi bi-list text-3xl"></i>
          </button>
        </div>
      </div>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-white border-t">
      <a href="index.html" class="block py-3 px-4 text-gray-700 hover:bg-pink-50">Home</a>
      <a href="products.html" class="block py-3 px-4 text-gray-700 hover:bg-pink-50">Shop</a>
      <a href="about.html" class="block py-3 px-4 text-gray-700 hover:bg-pink-50">About Us</a>
      <a href="contact.html" class="block py-3 px-4 text-gray-700 hover:bg-pink-50">Contact</a>
      <a href="login.html" class="block py-3 px-4 text-gray-700 hover:bg-pink-50">Login</a>
    </div>
  </nav>

  <main class="pt-28 pb-16">
    <section class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
      <div class="bg-white rounded-2xl shadow p-8">
        <div class="text-center mb-6">
          <h1 class="text-3xl font-serif font-bold text-gray-900">Welcome Back</h1>
          <p class="text-gray-600 mt-2">Login to manage your orders and wishlist</p>
        </div>
        <form id="login-form" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" required class="w-full rounded-lg border-gray-300 focus:ring-brand-main focus:border-brand-main" placeholder="you@example.com">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <div class="relative">
              <input id="password" type="password" required class="w-full rounded-lg border-gray-300 focus:ring-brand-main focus:border-brand-main pr-12" placeholder="••••••••">
              <button type="button" id="toggle" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 text-sm text-gray-600">
              <input type="checkbox" class="h-4 w-4 text-brand-main border-gray-300 rounded"> Remember me
            </label>
            <a href="#" class="text-sm text-brand-main hover:underline">Forgot password?</a>
          </div>
          <button class="w-full px-6 py-3 bg-gray-900 text-white rounded-full hover:bg-brand-main">Login</button>
        </form>
        <p id="login-status" class="hidden mt-4 text-green-600 text-center">Logged in (demo). Redirecting…</p>
        <p class="text-center text-sm text-gray-600 mt-6">No account? <a href="signup.html" class="text-brand-main hover:underline">Create one</a></p>
      </div>
    </section>
  </main>

  <footer class="border-t bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">
        <div class="flex items-center">
          <i class="bi bi-gem text-brand-main text-2xl mr-2"></i>
          <span class="font-serif text-xl font-bold text-gray-900">LuxeGlow</span>
        </div>
        <div class="flex gap-6 text-gray-600">
          <a href="index.html" class="hover:text-brand-main">Home</a>
          <a href="products.html" class="hover:text-brand-main">Shop</a>
          <a href="about.html" class="hover:text-brand-main">About</a>
          <a href="contact.html" class="hover:text-brand-main">Contact</a>
        </div>
        <div class="flex gap-4 text-gray-600">
          <a href="#" class="hover:text-brand-main"><i class="bi bi-instagram"></i></a>
          <a href="#" class="hover:text-brand-main"><i class="bi bi-facebook"></i></a>
          <a href="#" class="hover:text-brand-main"><i class="bi bi-twitter"></i></a>
        </div>
      </div>
      <p class="text-center text-sm text-gray-400 mt-6">© <span id="year"></span> LuxeGlow. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');
    if (btn) btn.addEventListener('click', () => menu.classList.toggle('hidden'));
    document.getElementById('year').textContent = new Date().getFullYear();
    const form = document.getElementById('login-form');
    const out = document.getElementById('login-status');
    const toggle = document.getElementById('toggle');
    const pw = document.getElementById('password');
    toggle.addEventListener('click', () => {
      pw.type = pw.type === 'password' ? 'text' : 'password';
      toggle.innerHTML = pw.type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      out.classList.remove('hidden');
      setTimeout(() => { window.location.href = 'products.html'; }, 800);
    });
  </script>
</body>
</html>
